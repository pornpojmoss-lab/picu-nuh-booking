<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5fa5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PICU NUH">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>PICU NUH Booking</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(160deg,#f7fbff,#e9f5fb);color:#16324f}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(440px,100%);background:#fff;border-radius:28px;padding:30px 24px;box-shadow:0 18px 50px rgba(15,72,110,.15);text-align:center}
.logo{width:170px;height:170px;object-fit:contain;margin:0 auto 14px;display:block}
h1{margin:0;color:#083b73;font-size:28px;letter-spacing:.3px}
h2{margin:5px 0 20px;color:#159ca4;font-size:18px;font-weight:700}
p{color:#58728a;line-height:1.55;font-size:14px}
.open{display:block;width:100%;border:0;border-radius:16px;padding:16px;background:linear-gradient(90deg,#12a6a0,#0b6fc0);color:#fff;font-size:18px;font-weight:800;text-decoration:none;box-shadow:0 8px 20px rgba(11,111,192,.22)}
.install{display:none;margin-top:12px;width:100%;border:1px solid #cfe0ee;border-radius:14px;padding:13px;background:#f5faff;color:#0b5fa5;font-weight:700;font-size:15px}
.note{margin-top:18px;font-size:12px;color:#7890a3}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <img class="logo" src="./icons/icon-512.png" alt="PICU NUH Booking">
    <h1>PICU NUH Booking</h1>
    <h2>Naresuan University Hospital</h2>
    <p>ระบบจองย้ายผู้ป่วยเข้า PICU</p>
    <a class="open" href="https://script.google.com/macros/s/AKfycbwOUdVRJDwg1tKx79skIqVFCwtmpomCNlF-BsuG5yYsdQnwUR0CgLjuTHhkW8Uspsfw/exec">OPEN PICU NUH</a>
    <button class="install" id="installBtn">INSTALL APP</button>
    <div class="note">For authorized hospital users</div>
  </section>
</main>
<script>
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});
installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = 'none';
});
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(console.error);
}
</script>
</body>
</html>
